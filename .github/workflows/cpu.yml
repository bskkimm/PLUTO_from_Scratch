name: CPU verification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Unit and integration (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==9.1.1 mlflow==3.14.0 scipy==1.15.3
      - name: Run unit, integration and notebook tests
        env:
          OMP_NUM_THREADS: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: .
        run: |
          python -m pytest -q -p no:cacheprovider tests
          python scripts/run_notebook.py
  hygiene:
    name: Lint and notebook integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.21
      - run: ruff check pluto scripts tests notebooks/pluto_e2e_walkthrough.ipynb
      - run: ruff format --check pluto scripts tests
      - run: python scripts/check_notebook.py
  package:
    name: Clean install and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .
      - name: Exercise installed package outside checkout
        working-directory: /tmp
        env:
          OMP_NUM_THREADS: '1'
        run: |
          python -m pluto.train --out /tmp/pluto-ci-run --epochs 1
          python -m pluto.evaluate /tmp/pluto-ci-run/checkpoint.pt
  gate:
    name: CPU verification aggregate
    if: always()
    needs: [test, hygiene, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$HYGIENE_RESULT" = success
          test "$PACKAGE_RESULT" = success
