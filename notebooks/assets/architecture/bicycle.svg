<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="410" viewBox="0 0 1140 410"><rect width="100%" height="100%" fill="#f5f8fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#465d76"/></marker></defs><text x="25" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#18263d">Kinematic bicycle and finite-horizon tracking</text><rect x="35" y="100" width="330" height="120" rx="7" fill="#d6e8f7" stroke="#465d76"/><text x="50" y="130" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">State: x, y, yaw, speed</text><text x="50" y="158" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">Control: acceleration, steering</text><text x="50" y="185" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">dt = 0.1 s; distance in m</text><path d="M365 160 H430" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="430" y="100" width="320" height="120" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="445" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">x' = x + v cos(yaw) dt</text><text x="445" y="158" font-family="sans-serif" font-size="16" font-weight="normal" fill="#18263d">y' = y + v sin(yaw) dt</text><text x="445" y="185" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">yaw' = yaw + v tan(δ) dt / L</text><path d="M750 160 H815" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="815" y="100" width="290" height="120" rx="7" fill="#f9e9ce" stroke="#465d76"/><text x="830" y="130" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Straight toy example</text><text x="830" y="158" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">x=0, v=1 m/s, yaw=0</text><text x="830" y="185" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">after one step: x=0.1 m</text><rect x="35" y="270" width="1070" height="60" rx="7" fill="#f5dce0" stroke="#465d76"/><text x="50" y="296" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">Reference states → backward LQR gains → forward bicycle rollout → external rule scorer</text><text x="25" y="375" font-family="sans-serif" font-size="15" font-weight="normal" fill="#465d76">Illustrative tracker; not yet validated against the official PDM/nuPlan simulator.</text></svg>