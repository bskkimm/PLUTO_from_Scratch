<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="830" viewBox="0 0 1440 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52667c"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c7d2" stroke-width="1"/></pattern></defs><rect width="1440" height="830" fill="#fafbf9"/><rect width="1440" height="8" fill="#007f80"/><text x="38" y="51" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#007f80" font-weight="700" text-anchor="start">PLUTO / 11</text><text x="38" y="96" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#172d46" font-weight="700" text-anchor="start">A reference path becomes a physically tracked rollout</text><text x="38" y="130" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#52667c" font-weight="400" text-anchor="start">Educational kinematic bicycle + finite-horizon LQR controller • state (x,y,θ,v), control (a,δ)</text><rect x="38" y="164" width="715" height="578" rx="12" fill="white" stroke="#d6e1e8" /><text x="60" y="198" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172d46" font-weight="700" text-anchor="start">A / Steering creates heading change around the rear axle</text><path d="M105 633 H682 M105 633 V251" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="662" y="670" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172d46" font-weight="400" text-anchor="start">x (m)</text><text x="66" y="244" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172d46" font-weight="400" text-anchor="start">y (m)</text><g transform="translate(355,439) rotate(60) scale(2.2)" opacity="1"><rect x="-18" y="-33" width="36" height="66" rx="8" fill="#007f80" stroke="#172d46" stroke-width="1.5"/><rect x="-13" y="-17" width="26" height="13" rx="3" fill="#dceef0" stroke="none" /><rect x="-12" y="15" width="24" height="9" rx="2" fill="#c8d8e1" stroke="none" /><path d="M-16 -24 H-8 M8 -24 H16" fill="none" stroke="#f9d583" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M287 479 L407 409" fill="none" stroke="#b87508" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="354" y="510" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#b87508" font-weight="700" text-anchor="start">wheelbase L</text><path d="M408 408 l64 -71" fill="none" stroke="#bd4652" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="458" y="386" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#bd4652" font-weight="700" text-anchor="start">steering δ</text><path d="M287 479 l100 -58" fill="none" stroke="#007f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="230" y="405" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#007f80" font-weight="700" text-anchor="start">heading θ</text><path d="M289 479 C401 409 466 302 550 241" fill="none" stroke="#007f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="105" y="711" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#007f80" font-weight="700" text-anchor="start">θ′ = θ + v·tan(δ)·Δt / L</text><rect x="778" y="164" width="624" height="282" rx="12" fill="white" stroke="#d6e1e8" /><text x="800" y="198" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172d46" font-weight="700" text-anchor="start">B / Verify one straight step</text><text x="802" y="249" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172d46" font-weight="400" text-anchor="start">x=0, y=0, θ=0, v=1 m/s</text><text x="802" y="295" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172d46" font-weight="400" text-anchor="start">Δt=0.1 s, steering δ=0</text><text x="802" y="354" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#007f80" font-weight="700" text-anchor="start">x′ = 0 + 1·cos(0)·0.1 = 0.1 m</text><text x="802" y="401" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#172d46" font-weight="400" text-anchor="start">y′ = 0 m; heading remains 0 rad</text><rect x="778" y="474" width="624" height="268" rx="12" fill="white" stroke="#d6e1e8" /><text x="800" y="508" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172d46" font-weight="700" text-anchor="start">C / Controller computation</text><text x="805" y="552" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#007f80" font-weight="700" text-anchor="start">Reference states</text><path d="M827 566 V593" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="805" y="623" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#406dbe" font-weight="700" text-anchor="start">Backward Riccati recursion → gains</text><path d="M827 637 V664" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="805" y="694" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#b87508" font-weight="700" text-anchor="start">Forward bicycle rollout → tracked states</text><path d="M38 769 H1402" fill="none" stroke="#d6e1e8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="802" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="start">Only the straight-step arithmetic is numeric here. The local bicycle/LQR controller has not been validated against official nuPlan/PDM.</text></svg>