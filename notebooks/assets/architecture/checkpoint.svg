" text-anchor="start">C / Resume only the same experiment</text><text x="63" y="648" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#007f80" font-weight="700" text-anchor="start">Check config / manifest / code hashes</text><path d="M540 642 H604" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="625" y="648" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#406dbe" font-weight="700" text-anchor="start">Restore state</text><path d="M824 642 H888" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="910" y="648" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#b87508" font-weight="700" text-anchor="start">Continue at next epoch</text><text x="63" y="706" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#bd4652" font-weight="400" text-anchor="start">Mismatch or missing code hashes → reject resume before replacing run provenance.</text><path d="M38 769 H1402" fill="none" stroke="#d6e1e8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="802" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="start">CUDA and real-data resume need their own validation. Optional MLflow and progress/ETA are implemented outside this notebook.</text></svg>