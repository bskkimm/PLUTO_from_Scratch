<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="410" viewBox="0 0 1140 410"><rect width="100%" height="100%" fill="#f5f8fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#465d76"/></marker></defs><text x="25" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#18263d">Contrastive views: same encoder, different supervision</text><rect x="25" y="90" width="170" height="55" rx="7" fill="#d6e8f7" stroke="#465d76"/><text x="40" y="124" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">original</text><path d="M195 117 H280" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="180" width="170" height="55" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="40" y="214" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">positive</text><path d="M195 207 H280" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="270" width="170" height="55" rx="7" fill="#f5dce0" stroke="#465d76"/><text x="40" y="304" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">negative</text><path d="M195 297 H280" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="90" width="225" height="235" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="295" y="138" font-family="sans-serif" font-size="18" font-weight="bold" fill="#18263d">Shared scene</text><text x="295" y="164" font-family="sans-serif" font-size="16" font-weight="normal" fill="#18263d">encode all views</text><text x="295" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#18263d">project only for triplet</text><rect x="660" y="110" width="395" height="72" rx="7" fill="#f9e9ce" stroke="#465d76"/><text x="675" y="139" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Triplet contrastive loss</text><text x="675" y="162" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">compare sim(z,z⁺) with sim(z,z⁻)</text><rect x="660" y="235" width="395" height="72" rx="7" fill="#f5dce0" stroke="#465d76"/><text x="675" y="264" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Supervised objective</text><text x="675" y="287" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">decode original + positive only</text><path d="M505 160 H660" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><path d="M505 270 H660" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><text x="25" y="375" font-family="sans-serif" font-size="15" font-weight="normal" fill="#465d76">Negative targets are not used. Whether a view preserves or changes causality must be established by preprocessing.</text></svg>