<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="410" viewBox="0 0 1140 410"><rect width="100%" height="100%" fill="#f5f8fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#465d76"/></marker></defs><text x="25" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#18263d">Masked temporal attention pyramid</text><text x="25" y="72" font-family="sans-serif" font-size="16" font-weight="normal" fill="#18263d">Paper-sized example: 20 history vectors; D=128. Local attention is not NATTEN-verified.</text><rect x="40" y="95" width="210" height="60" rx="7" fill="#d6e8f7" stroke="#465d76"/><text x="55" y="120" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">20 × 32</text><text x="55" y="142" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">local window 3</text><rect x="385" y="95" width="220" height="60" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="400" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">Project to 128</text><text x="400" y="142" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">temporal lateral convolution</text><path d="M250 125 H385" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="190" width="210" height="60" rx="7" fill="#d6e8f7" stroke="#465d76"/><text x="55" y="215" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">10 × 64</text><text x="55" y="237" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">local window 3</text><rect x="385" y="190" width="220" height="60" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="400" y="215" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">Project to 128</text><text x="400" y="237" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">temporal lateral convolution</text><path d="M250 220 H385" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="285" width="210" height="60" rx="7" fill="#d6e8f7" stroke="#465d76"/><text x="55" y="310" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">5 × 128</text><text x="55" y="332" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">local window 5</text><rect x="385" y="285" width="220" height="60" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="400" y="310" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">Project to 128</text><text x="400" y="332" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">temporal lateral convolution</text><path d="M250 315 H385" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><path d="M145 155 V190" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><path d="M145 250 V285" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><path d="M605 315 H650 V220 H605" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><path d="M605 220 H650 V125 H605" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="740" y="95" width="340" height="60" rx="7" fill="#f9e9ce" stroke="#465d76"/><text x="755" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">Fuse + read last valid</text><text x="755" y="142" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">agent token [B,A,128]</text><path d="M605 125 H740" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><text x="40" y="380" font-family="sans-serif" font-size="15" font-weight="normal" fill="#465d76">Mask padded inputs → zero padded outputs; resampling preserves finite empty-agent output.</text></svg>