<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="410" viewBox="0 0 1140 410"><rect width="100%" height="100%" fill="#f5f8fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#465d76"/></marker></defs><text x="25" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#18263d">Synthetic inference and open-loop ADE</text><text x="25" y="78" font-family="sans-serif" font-size="16" font-weight="normal" fill="#18263d">Toy logits: [2.0, 1.0] → choose candidate 0; padded references are excluded.</text><rect x="25" y="110" width="300" height="65" rx="7" fill="#d6e8f7" stroke="#465d76"/><text x="40" y="138" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Candidate 0</text><text x="40" y="160" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">(0,0), (2,0) metres</text><rect x="25" y="205" width="300" height="65" rx="7" fill="#f5dce0" stroke="#465d76"/><text x="40" y="233" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Target</text><text x="40" y="255" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">(0,0), (1,0) metres</text><path d="M325 142 H430" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><path d="M325 237 H430" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="430" y="130" width="300" height="120" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="445" y="161" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Point distances</text><text x="445" y="190" font-family="sans-serif" font-size="16" font-weight="normal" fill="#18263d">0 m and 1 m</text><text x="445" y="222" font-family="sans-serif" font-size="18" font-weight="bold" fill="#18263d">mean = 0.5 m</text><path d="M730 190 H815" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="815" y="145" width="290" height="85" rx="7" fill="#f9e9ce" stroke="#465d76"/><text x="830" y="175" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Synthetic ADE</text><text x="830" y="200" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">0.5 m (illustrative)</text><text x="25" y="345" font-family="sans-serif" font-size="15" font-weight="normal" fill="#465d76">The official benchmark uses closed-loop simulation; this open-loop diagnostic is not its score.</text></svg>