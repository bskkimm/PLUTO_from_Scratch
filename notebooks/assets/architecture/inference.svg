<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="830" viewBox="0 0 1440 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52667c"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c7d2" stroke-width="1"/></pattern></defs><rect width="1440" height="830" fill="#fafbf9"/><rect width="1440" height="8" fill="#007f80"/><text x="38" y="51" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#007f80" font-weight="700" text-anchor="start">PLUTO / 10</text><text x="38" y="96" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#172d46" font-weight="700" text-anchor="start">Separate candidate selection from trajectory error</text><text x="38" y="130" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#52667c" font-weight="400" text-anchor="start">The notebook uses learned logits; the package also exposes a caller-supplied rule-scoring interface</text><rect x="38" y="164" width="651" height="578" rx="12" fill="white" stroke="#d6e1e8" /><text x="60" y="198" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172d46" font-weight="700" text-anchor="start">A / Toy learned selection with two candidates</text><rect x="81" y="230" width="282" height="449" rx="8" fill="#e7eee9" stroke="none" /><rect x="137.4" y="230" width="169.2" height="449" rx="0" fill="#e1e8ed" stroke="none" /><path d="M145.86 230 V679" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M298.14 230 V679" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M222.0 237 V672" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 12"/><g transform="translate(260,623) rotate(0) scale(1)" opacity="1"><rect x="-18" y="-33" width="36" height="66" rx="8" fill="#007f80" stroke="#172d46" stroke-width="1.5"/><rect x="-13" y="-17" width="26" height="13" rx="3" fill="#dceef0" stroke="none" /><rect x="-12" y="15" width="24" height="9" rx="2" fill="#c8d8e1" stroke="none" /><path d="M-16 -24 H-8 M8 -24 H16" fill="none" stroke="#f9d583" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M260 583 C260 498 250 382 252 269" fill="none" stroke="#007f80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M260 583 C250 465 159 393 150 310" fill="none" stroke="#b87508" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="390" y="277" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#52667c" font-weight="700" text-anchor="start">logits</text><text x="390" y="335" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#007f80" font-weight="700" text-anchor="start">candidate 0</text><rect x="390" y="353" width="220.0" height="26" rx="3" fill="#007f80" stroke="none" /><text x="390" y="410" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#007f80" font-weight="400" text-anchor="start">2.0</text><text x="390" y="447" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#b87508" font-weight="700" text-anchor="start">candidate 1</text><rect x="390" y="465" width="110.0" height="26" rx="3" fill="#b87508" stroke="none" /><text x="390" y="522" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#b87508" font-weight="400" text-anchor="start">1.0</text><text x="390" y="595" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#007f80" font-weight="700" text-anchor="start">argmax → 0</text><text x="390" y="642" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172d46" font-weight="400" text-anchor="start">Invalid references</text><text x="390" y="674" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172d46" font-weight="400" text-anchor="start">are excluded.</text><rect x="716" y="164" width="686" height="381" rx="12" fill="white" stroke="#d6e1e8" /><text x="738" y="198" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172d46" font-weight="700" text-anchor="start">B / Open-loop ADE has a geometric meaning</text><path d="M780 447 H1322 M780 447 V260" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1290" y="486" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172d46" font-weight="400" text-anchor="start">x (m)</text><path d="M820 409 H1050" fill="none" stroke="#007f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M820 409 H1280" fill="none" stroke="#b87508" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><circle cx="820" cy="409" r="8" fill="#007f80" stroke="none" /><circle cx="1050" cy="409" r="8" fill="#007f80" stroke="none" /><circle cx="1280" cy="409" r="8" fill="#b87508" stroke="none" /><text x="815" y="365" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172d46" font-weight="400" text-anchor="start">0</text><text x="1045" y="365" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172d46" font-weight="400" text-anchor="start">1</text><text x="1275" y="365" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172d46" font-weight="400" text-anchor="start">2</text><text x="783" y="250" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#007f80" font-weight="700" text-anchor="start">Target: (0,0), (1,0)</text><text x="783" y="288" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#b87508" font-weight="700" text-anchor="start">Prediction: (0,0), (2,0)</text><text x="783" y="518" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#007f80" font-weight="700" text-anchor="start">ADE = (0 m + 1 m) / 2 = 0.5 m</text><rect x="716" y="572" width="686" height="170" rx="12" fill="#f1f4f8" stroke="#d6e1e8" /><text x="740" y="614" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172d46" font-weight="700" text-anchor="start">Optional package-level selection</text><text x="740" y="655" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#172d46" font-weight="400" text-anchor="start">top-K → external evaluator → rule + α·probability</text><text x="740" y="704" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172d46" font-weight="400" text-anchor="start">Returns the original proposal; no references → free plan.</text><path d="M38 769 H1402" fill="none" stroke="#d6e1e8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="802" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="start">ADE is an open-loop geometric diagnostic. The official nuPlan closed-loop score requires separate simulation and evaluation.</text></svg>