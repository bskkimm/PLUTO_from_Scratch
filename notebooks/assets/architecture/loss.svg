<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="410" viewBox="0 0 1140 410"><rect width="100%" height="100%" fill="#f5f8fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#465d76"/></marker></defs><text x="25" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#18263d">Training objective: chosen plan, distance field and triplets</text><rect x="25" y="75" width="315" height="85" rx="7" fill="#d6e8f7" stroke="#465d76"/><text x="40" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Imitation + prediction</text><text x="40" y="130" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">Smooth L1 + mode cross-entropy</text><rect x="395" y="75" width="315" height="85" rx="7" fill="#f5dce0" stroke="#465d76"/><text x="410" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Distance-field penalty</text><text x="410" y="130" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">max(0, radius + margin − d)</text><rect x="765" y="75" width="335" height="85" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="780" y="104" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">Contrastive objective</text><text x="780" y="130" font-family="sans-serif" font-size="15" font-weight="normal" fill="#18263d">original ↔ positive vs negative</text><text x="30" y="212" font-family="sans-serif" font-size="18" font-weight="bold" fill="#18263d">Illustrative SDF example</text><text x="30" y="242" font-family="sans-serif" font-size="16" font-weight="normal" fill="#18263d">radius = 1.0 m, margin = 0.2 m, sampled distance = 0.7 m</text><rect x="30" y="260" width="420" height="55" rx="7" fill="#f9e9ce" stroke="#465d76"/><text x="45" y="294" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">hinge = max(0, 1.0 + 0.2 − 0.7) = 0.5 m</text><text x="520" y="218" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">Positive + original: supervised</text><text x="520" y="249" font-family="sans-serif" font-size="16" font-weight="normal" fill="#18263d">Negative: scene encoder + contrastive loss only</text><text x="520" y="280" font-family="sans-serif" font-size="16" font-weight="normal" fill="#18263d">SDF lookup is bilinear and differentiable</text><text x="25" y="375" font-family="sans-serif" font-size="15" font-weight="normal" fill="#465d76">Teacher-forced candidate labels are inputs; displayed numbers are illustrative, not measured results.</text></svg>