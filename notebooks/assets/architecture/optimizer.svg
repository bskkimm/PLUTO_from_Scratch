<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="830" viewBox="0 0 1440 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52667c"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c7d2" stroke-width="1"/></pattern></defs><rect width="1440" height="830" fill="#fafbf9"/><rect width="1440" height="8" fill="#007f80"/><text x="38" y="51" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#007f80" font-weight="700" text-anchor="start">PLUTO / 08</text><text x="38" y="96" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#172d46" font-weight="700" text-anchor="start">A training step: compute, differentiate, then update</text><text x="38" y="130" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#52667c" font-weight="400" text-anchor="start">A concrete Smooth L1 example plus the actual order of the notebook's AdamW step</text><rect x="38" y="164" width="650" height="399" rx="12" fill="white" stroke="#d6e1e8" /><text x="60" y="198" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172d46" font-weight="700" text-anchor="start">A / Inspect one scalar regression term</text><path d="M103 493 H628 M103 493 V252" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="528" y="535" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172d46" font-weight="400" text-anchor="start">prediction x</text><text x="117" y="245" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#007f80" font-weight="700" text-anchor="start">Smooth L1 loss; target x = 1</text><path d="M110.00 355.00 L116.00 359.50 L122.00 364.00 L128.00 368.50 L134.00 373.00 L140.00 377.50 L146.00 382.00 L152.00 386.50 L158.00 391.00 L164.00 395.50 L170.00 400.00 L176.00 404.50 L182.00 409.00 L188.00 413.50 L194.00 418.00 L200.00 422.50 L206.00 427.00 L212.00 431.50 L218.00 436.00 L224.00 440.50 L230.00 445.00 L236.00 449.39 L242.00 453.55 L248.00 457.49 L254.00 461.20 L260.00 464.69 L266.00 467.95 L272.00 470.99 L278.00 473.80 L284.00 476.39 L290.00 478.75 L296.00 480.89 L302.00 482.80 L308.00 484.49 L314.00 485.95 L320.00 487.19 L326.00 488.20 L332.00 488.99 L338.00 489.55 L344.00 489.89 L350.00 490.00 L356.00 489.89 L362.00 489.55 L368.00 488.99 L374.00 488.20 L380.00 487.19 L386.00 485.95 L392.00 484.49 L398.00 482.80 L404.00 480.89 L410.00 478.75 L416.00 476.39 L422.00 473.80 L428.00 470.99 L434.00 467.95 L440.00 464.69 L446.00 461.20 L452.00 457.49 L458.00 453.55 L464.00 449.39 L470.00 445.00 L476.00 440.50 L482.00 436.00 L488.00 431.50 L494.00 427.00 L500.00 422.50 L506.00 418.00 L512.00 413.50 L518.00 409.00 L524.00 404.50 L530.00 400.00 L536.00 395.50 L542.00 391.00 L548.00 386.50 L554.00 382.00 L560.00 377.50 L566.00 373.00 L572.00 368.50 L578.00 364.00 L584.00 359.50 L590.00 355.00" fill="none" stroke="#007f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="230" y="518" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">0</text><text x="350" y="518" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">1</text><text x="470" y="518" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">2</text><circle cx="230" cy="445" r="7" fill="#b87508" stroke="none" /><text x="250" y="427" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#b87508" font-weight="700" text-anchor="start">x=0 → loss=0.5</text><path d="M230 458 H300" fill="none" stroke="#bd4652" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="180" y="321" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#bd4652" font-weight="700" text-anchor="start">gradient = −1</text><text x="180" y="357" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172d46" font-weight="400" text-anchor="start">descent moves x toward 1</text><rect x="715" y="164" width="687" height="579" rx="12" fill="white" stroke="#d6e1e8" /><text x="737" y="198" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172d46" font-weight="700" text-anchor="start">B / Execute in dependency order</text><circle cx="752" cy="246" r="20" fill="#007f80" stroke="none" /><text x="752" y="253" font-family="DejaVu Sans,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">1</text><text x="791" y="241" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172d46" font-weight="700" text-anchor="start">forward(batch)</text><text x="791" y="271" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172d46" font-weight="400" text-anchor="start">plans, logits, forecasts, free trajectory</text><path d="M752 270 V300" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="752" cy="339" r="20" fill="#007f80" stroke="none" /><text x="752" y="346" font-family="DejaVu Sans,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">2</text><text x="791" y="334" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172d46" font-weight="700" text-anchor="start">compute losses</text><text x="791" y="364" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172d46" font-weight="400" text-anchor="start">sum channels; mask invalid timesteps</text><path d="M752 363 V393" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="752" cy="432" r="20" fill="#007f80" stroke="none" /><text x="752" y="439" font-family="DejaVu Sans,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">3</text><text x="791" y="427" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172d46" font-weight="700" text-anchor="start">zero_grad()</text><text x="791" y="457" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172d46" font-weight="400" text-anchor="start">clear the previous accumulated gradients</text><path d="M752 456 V486" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="752" cy="525" r="20" fill="#bd4652" stroke="none" /><text x="752" y="532" font-family="DejaVu Sans,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">4</text><text x="791" y="520" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172d46" font-weight="700" text-anchor="start">loss.backward()</text><text x="791" y="550" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172d46" font-weight="400" text-anchor="start">autograd follows the dependency graph</text><path d="M752 549 V579" fill="none" stroke="#52667c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="752" cy="618" r="20" fill="#007f80" stroke="none" /><text x="752" y="625" font-family="DejaVu Sans,sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">5</text><text x="791" y="613" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#172d46" font-weight="700" text-anchor="start">optimizer.step()</text><text x="791" y="643" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172d46" font-weight="400" text-anchor="start">AdamW updates learnable parameters</text><rect x="38" y="590" width="650" height="153" rx="12" fill="#eaf3f4" stroke="#d6e1e8" /><text x="62" y="633" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172d46" font-weight="700" text-anchor="start">Full notebook loss</text><text x="62" y="677" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#007f80" font-weight="400" text-anchor="start">chosen-plan regression + classification</text><text x="62" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#007f80" font-weight="400" text-anchor="start">+ free-plan regression + other-agent prediction</text><path d="M38 769 H1402" fill="none" stroke="#d6e1e8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="802" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#52667c" font-weight="400" text-anchor="start">The Smooth L1 example is analytical. AdamW uses moment estimates and weight decay, so the scalar arrow is not a measured step.</text></svg>