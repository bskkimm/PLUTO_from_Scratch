<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="410" viewBox="0 0 1140 410"><rect width="100%" height="100%" fill="#f5f8fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#465d76"/></marker></defs><text x="25" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#18263d">Factorized lateral–longitudinal attention</text><text x="25" y="75" font-family="sans-serif" font-size="16" font-weight="normal" fill="#18263d">Toy example: B=1, R=2 references, M=3 learned modes, D=16</text><text x="48" y="153" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">line 0</text><rect x="150" y="120" width="72" height="50" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="168" y="151" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">q00</text><rect x="246" y="120" width="72" height="50" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="264" y="151" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">q01</text><rect x="342" y="120" width="72" height="50" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="360" y="151" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">q02</text><text x="48" y="227" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">line 1</text><rect x="150" y="194" width="72" height="50" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="168" y="225" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">q10</text><rect x="246" y="194" width="72" height="50" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="264" y="225" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">q11</text><rect x="342" y="194" width="72" height="50" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="360" y="225" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18263d">q12</text><text x="155" y="94" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">mode 0</text><text x="251" y="94" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">mode 1</text><text x="347" y="94" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">mode 2</text><path d="M185 100 V116" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><path d="M281 100 V116" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><path d="M377 100 V116" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><path d="M440 170 H500" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="510" y="100" width="245" height="62" rx="7" fill="#d6e8f7" stroke="#465d76"/><text x="525" y="126" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">1 · lateral attention</text><text x="525" y="147" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">across reference rows</text><rect x="510" y="190" width="245" height="62" rx="7" fill="#dcefe4" stroke="#465d76"/><text x="525" y="216" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">2 · mode attention</text><text x="525" y="237" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">across mode columns</text><path d="M632 162 V190" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><rect x="830" y="145" width="270" height="62" rx="7" fill="#f9e9ce" stroke="#465d76"/><text x="845" y="171" font-family="sans-serif" font-size="16" font-weight="bold" fill="#18263d">3 · scene cross-attention</text><text x="845" y="192" font-family="sans-serif" font-size="14" font-weight="normal" fill="#18263d">queries read scene tokens</text><path d="M755 220 H790 V176 H830" fill="none" stroke="#465d76" stroke-width="2" marker-end="url(#a)"/><text x="25" y="326" font-family="sans-serif" font-size="15" font-weight="normal" fill="#465d76">Masked references cannot be keys or selected outputs. Complexity uses R²M + RM², not (RM)².</text></svg>