[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pluto-from-scratch"
version = "0.1.0"
description = "Educational partial PLUTO implementation"
requires-python = ">=3.10"
dependencies = ["torch==2.9.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
tracking = ["mlflow==3.14.0"]
science = ["scipy==1.15.3"]

[tool.setuptools.packages.find]
include = ["pluto*"]
